name: CI

on:
  push:
  pull_request: # duplicated by 'push', but needed for external PRs; concurrency config prevents duplicate runs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CLICOLOR_FORCE: 1
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@ace6ebe54a6a0c86dfb5f7764b17f793b6925bc3 # v2.82.3
        with:
          tool: typos,dprint,cargo-machete,cargo-shear
          checksum: true
      # Within this workflow we will continue on error, to give
      # maximum information to the developer.
      - run: cargo fmt --all --check
        if: ${{ !cancelled() }}
      - run: typos
        if: ${{ !cancelled() }}
      - run: dprint check --list-different --verbose
        # to fix: dprint fmt
        if: ${{ !cancelled() }}
      - run: dprint fmt --diff
        if: ${{ failure() }}
      - run: cargo machete --with-metadata
        if: ${{ !cancelled() }}
      - run: cargo shear
        if: ${{ !cancelled() }}

  cargo-deny:
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # Prevent sudden announcement of a new advisory from failing ci:
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - name: Install tools
        uses: taiki-e/install-action@ace6ebe54a6a0c86dfb5f7764b17f793b6925bc3 # v2.82.3
        # this action is used in multiple places
        with:
          tool: cargo-deny
          checksum: true
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          persist-credentials: false
      - run: cargo deny check ${{ matrix.checks }}

  #
  #
  # Cheap, fast checks serve as a gate for the more time-consuming tasks below
  #
  #

  clippy:
    name: clippy @${{ matrix.rust-version }}
    runs-on: ubuntu-26.04
    needs: [checks, cargo-deny]
    timeout-minutes: 10
    strategy:
      fail-fast: false # useful for testing
      matrix:
        rust-version: [1.88.0] # MSRV
        include:
          - rust-version: nightly
    # Nightly builds sometimes break things, so don't treat that as fatal
    continue-on-error: ${{ matrix.rust-version == 'nightly' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ matrix.rust-version }}
        uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        # this action is used in multiple places
        with:
          toolchain: ${{ matrix.rust-version }}
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        # this action is used in multiple places
        # Cache won't help as much on nightly builds... but there's still value in running it multiple times in one day.
        with:
          key: ${{ matrix.rust-version }}
          cache-on-failure: true
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo clippy --locked --tests --workspace --no-deps

  docs:
    runs-on: ubuntu-26.04
    needs: [checks, cargo-deny]
    timeout-minutes: 10
    env:
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # 6.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f7ccc83f9ed1e5b9c81d8a67d7ad1a747e22a561
        with:
          # update periodically
          toolchain: nightly-2025-07-31
          components: rust-src
      - uses: dtolnay/install@b2464e56f40a0193c82503a074e7ccf9dd2d7f40 # 2025-09-07
        with:
          crate: cargo-docs-rs
      ####### Ensure all tools are loaded before rust-cache, or they will be cached themselves ######
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        # this action is used in multiple places
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - run: cargo docs-rs -p qcp --locked

  test:
    uses: ./.github/workflows/test.yml
    needs: [checks, cargo-deny]

  package:
    uses: ./.github/workflows/package.yml
    needs: [checks, cargo-deny]
